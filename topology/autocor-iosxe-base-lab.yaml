lab:
  description: "AUTOCOR IOS XE Expanded Lab"
  notes: ""
  title: "AUTOCOR-LAB-EXPANDED"
  version: "0.3.0"

nodes:
  - id: n0
    label: cat8k-1
    node_definition: cat8000v
    image_definition: cat8000v-17.09.01a
    x: -650
    y: 0
    interfaces:
      - id: i0
        label: GigabitEthernet1
        slot: 0
        type: physical
      - id: i1
        label: GigabitEthernet2
        slot: 1
        type: physical
    configuration: |-
      hostname CAT8K-1
      username cisco privilege 15 secret cisco
      ip domain-name lab.local
      crypto key generate rsa modulus 2048

      interface GigabitEthernet1
       description TO-EXT-CONN
       ip address dhcp
       no shutdown

      interface GigabitEthernet2
       description TO-CAT8K-2
       ip address 172.16.0.1 255.255.255.252
       no shutdown

      interface Loopback0
       description ASSET-MGMT-LOOPBACK
       ip address 1.1.1.1 255.255.255.255

      router ospf 1
       router-id 1.1.1.1
       network 172.16.0.0 0.0.0.3 area 0
       network 1.1.1.1 0.0.0.0 area 0
       default-information originate

      ip route 0.0.0.0 0.0.0.0 dhcp

      ip http server
      ip http secure-server
      restconf
      netconf-yang

      line vty 0 4
       login local
       transport input ssh

  - id: n1
    label: cat8k-2
    node_definition: cat8000v
    image_definition: cat8000v-17.09.01a
    x: -300
    y: 0
    interfaces:
      - id: i0
        label: GigabitEthernet1
        slot: 0
        type: physical
      - id: i1
        label: GigabitEthernet2
        slot: 1
        type: physical
      - id: i2
        label: GigabitEthernet3
        slot: 2
        type: physical
    configuration: |-
      hostname CAT8K-2
      username cisco privilege 15 secret cisco
      ip domain-name lab.local
      crypto key generate rsa modulus 2048

      interface GigabitEthernet1
       description TO-CAT8K-1
       ip address 172.16.0.2 255.255.255.252
       no shutdown

      interface GigabitEthernet2
       description TO-CAT8K-3
       ip address 172.16.0.5 255.255.255.252
       no shutdown

      interface GigabitEthernet3
       description TRUNK-TO-DIST-SW1
       no ip address
       no shutdown

      interface GigabitEthernet3.10
       description VLAN10-USERS
       encapsulation dot1Q 10
       ip address 10.10.10.1 255.255.255.0

      interface GigabitEthernet3.20
       description VLAN20-OPS
       encapsulation dot1Q 20
       ip address 10.20.20.1 255.255.255.0

      interface GigabitEthernet3.30
       description VLAN30-SERVERS
       encapsulation dot1Q 30
       ip address 10.30.30.1 255.255.255.0

      interface GigabitEthernet3.99
       description VLAN99-AUTOMATION
       encapsulation dot1Q 99
       ip address 10.99.99.1 255.255.255.0

      interface Loopback0
       description ASSET-MGMT-LOOPBACK
       ip address 2.2.2.2 255.255.255.255

      ip access-list extended VLAN20_TO_SERVER
       permit tcp 10.20.20.0 0.0.0.255 10.30.30.0 0.0.0.255 eq 22
       permit icmp 10.20.20.0 0.0.0.255 10.30.30.0 0.0.0.255
       deny ip 10.20.20.0 0.0.0.255 10.30.30.0 0.0.0.255
       permit ip any any

      interface GigabitEthernet3.20
       ip access-group VLAN20_TO_SERVER in

      router ospf 1
       router-id 2.2.2.2
       network 172.16.0.0 0.0.0.3 area 0
       network 172.16.0.4 0.0.0.3 area 0
       network 2.2.2.2 0.0.0.0 area 0
       network 10.10.10.0 0.0.0.255 area 10
       network 10.20.20.0 0.0.0.255 area 10
       network 10.30.30.0 0.0.0.255 area 10
       network 10.99.99.0 0.0.0.255 area 10

      ip http server
      ip http secure-server
      restconf
      netconf-yang

      line vty 0 4
       login local
       transport input ssh

  - id: n2
    label: cat8k-3
    node_definition: cat8000v
    image_definition: cat8000v-17.09.01a
    x: 50
    y: -120
    interfaces:
      - id: i0
        label: GigabitEthernet1
        slot: 0
        type: physical
      - id: i1
        label: GigabitEthernet2
        slot: 1
        type: physical
    configuration: |-
      hostname CAT8K-3
      username cisco privilege 15 secret cisco
      ip domain-name lab.local
      crypto key generate rsa modulus 2048

      interface GigabitEthernet1
       description TO-CAT8K-2
       ip address 172.16.0.6 255.255.255.252
       no shutdown

      interface GigabitEthernet2
       description MGMT-LAN
       ip address 192.168.50.1 255.255.255.0
       no shutdown

      interface Loopback0
       description ASSET-MGMT-LOOPBACK
       ip address 3.3.3.3 255.255.255.255

      router ospf 1
       router-id 3.3.3.3
       network 172.16.0.4 0.0.0.3 area 0
       network 192.168.50.0 0.0.0.255 area 20
       network 3.3.3.3 0.0.0.0 area 0

      ip http server
      ip http secure-server
      restconf
      netconf-yang

      line vty 0 4
       login local
       transport input ssh

  - id: n3
    label: dist-sw1
    node_definition: iosvl2
    x: 50
    y: 80
    interfaces:
      - id: i0
        label: GigabitEthernet0/0
        slot: 0
        type: physical
      - id: i1
        label: GigabitEthernet0/1
        slot: 1
        type: physical
      - id: i2
        label: GigabitEthernet0/2
        slot: 2
        type: physical
      - id: i3
        label: GigabitEthernet0/3
        slot: 3
        type: physical
    configuration: |-
      hostname DIST-SW1
      no ip domain-lookup
      ip domain-name lab.local
      username cisco privilege 15 secret cisco
      crypto key generate rsa modulus 2048
      ip ssh version 2

      vlan 10
       name USERS
      vlan 20
       name OPS
      vlan 30
       name SERVERS
      vlan 99
       name AUTOMATION

      interface Vlan99
       description MGMT-SVI
       ip address 10.99.99.11 255.255.255.0
       no shutdown

      ip default-gateway 10.99.99.1

      interface GigabitEthernet0/0
       description TRUNK-TO-CAT8K-2
       switchport trunk encapsulation dot1q
       switchport mode trunk
       switchport trunk allowed vlan 10,20,30,99
       no shutdown

      interface GigabitEthernet0/1
       description ACCESS-CLIENT-A
       switchport mode access
       switchport access vlan 10
       spanning-tree portfast
       no shutdown

      interface GigabitEthernet0/2
       description TRUNK-TO-DIST-SW2
       switchport trunk encapsulation dot1q
       switchport mode trunk
       switchport trunk allowed vlan 10,20,30,99
       no shutdown

      interface GigabitEthernet0/3
       description ACCESS-AUTOMATION-HOST
       switchport mode access
       switchport access vlan 99
       spanning-tree portfast
       no shutdown

      line vty 0 4
       login local
       transport input ssh

  - id: n4
    label: dist-sw2
    node_definition: iosvl2
    x: 360
    y: 80
    interfaces:
      - id: i0
        label: GigabitEthernet0/0
        slot: 0
        type: physical
      - id: i1
        label: GigabitEthernet0/1
        slot: 1
        type: physical
      - id: i2
        label: GigabitEthernet0/2
        slot: 2
        type: physical
    configuration: |-
      hostname DIST-SW2
      no ip domain-lookup
      ip domain-name lab.local
      username cisco privilege 15 secret cisco
      crypto key generate rsa modulus 2048
      ip ssh version 2

      vlan 10
       name USERS
      vlan 20
       name OPS
      vlan 30
       name SERVERS
      vlan 99
       name AUTOMATION

      interface Vlan99
       description MGMT-SVI
       ip address 10.99.99.12 255.255.255.0
       no shutdown

      ip default-gateway 10.99.99.1

      interface GigabitEthernet0/0
       description TRUNK-TO-DIST-SW1
       switchport trunk encapsulation dot1q
       switchport mode trunk
       switchport trunk allowed vlan 10,20,30,99
       no shutdown

      interface GigabitEthernet0/1
       description ACCESS-CLIENT-B
       switchport mode access
       switchport access vlan 20
       spanning-tree portfast
       no shutdown

      interface GigabitEthernet0/2
       description ACCESS-SERVER-A
       switchport mode access
       switchport access vlan 30
       spanning-tree portfast
       no shutdown

      line vty 0 4
       login local
       transport input ssh

  - id: n5
    label: client-a
    node_definition: alpine
    x: 360
    y: -20
    interfaces:
      - id: i0
        label: eth0
        slot: 0
        type: physical
    configuration: |-
      ip link set eth0 up
      ip addr add 10.10.10.10/24 dev eth0
      ip route add default via 10.10.10.1

  - id: n6
    label: client-b
    node_definition: alpine
    x: 620
    y: 20
    interfaces:
      - id: i0
        label: eth0
        slot: 0
        type: physical
    configuration: |-
      ip link set eth0 up
      ip addr add 10.20.20.10/24 dev eth0
      ip route add default via 10.20.20.1

  - id: n7
    label: server-a
    node_definition: alpine
    x: 620
    y: 150
    interfaces:
      - id: i0
        label: eth0
        slot: 0
        type: physical
    configuration: |-
      ip link set eth0 up
      ip addr add 10.30.30.10/24 dev eth0
      ip route add default via 10.30.30.1

  - id: n8
    label: automation-host
    node_definition: ubuntu
    x: 360
    y: 200
    interfaces:
      - id: i0
        label: ens2
        slot: 0
        type: physical
    configuration: |-
      ip link set ens2 up
      ip addr add 10.99.99.10/24 dev ens2
      ip route add default via 10.99.99.1

  - id: n9
    label: ext-conn
    node_definition: external_connector
    x: -900
    y: 0
    interfaces:
      - id: i0
        label: port
        slot: 0
        type: physical

links:
  - id: l0
    n1: n0
    i1: i1
    n2: n1
    i2: i0

  - id: l1
    n1: n1
    i1: i1
    n2: n2
    i2: i0

  - id: l2
    n1: n1
    i1: i2
    n2: n3
    i2: i0

  - id: l3
    n1: n3
    i1: i2
    n2: n4
    i2: i0

  - id: l4
    n1: n3
    i1: i1
    n2: n5
    i2: i0

  - id: l5
    n1: n4
    i1: i1
    n2: n6
    i2: i0

  - id: l6
    n1: n4
    i1: i2
    n2: n7
    i2: i0

  - id: l7
    n1: n3
    i1: i3
    n2: n8
    i2: i0

  - id: l8
    n1: n0
    i1: i0
    n2: n9
    i2: i0
