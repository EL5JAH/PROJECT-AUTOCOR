###############################################################
# Ansible Configuration File
# Purpose: Stable, portable, and secure defaults for lab + CI/CD
###############################################################

[defaults]

# Primary inventory file (relative to this config location)
# Keeps execution consistent without needing -i every time
inventory = ./inventory/hosts.yml

# Path to local vault password file (NOT committed to repo)
# Allows fully non-interactive runs (no --ask-vault-pass)
vault_password_file = ~/.ansible/.vault_pass.txt

# Disable SSH host key verification
# Prevents "Are you sure you want to continue connecting?" prompts
# OK for lab environments; NOT recommended for production
host_key_checking = False

# Prevent creation of retry files (*.retry)
# Keeps repo clean and avoids clutter after failed runs
retry_files_enabled = False

# Number of parallel forks (hosts executed simultaneously)
# Increase for faster runs, but limited by CPU/network capacity
forks = 10

# Disable automatic fact gathering
# Improves speed for network devices where facts are not needed
# Must explicitly call gather_facts if required
gathering = explicit

# Suppress deprecation warnings
# Keeps output clean; consider enabling when upgrading Ansible versions
deprecation_warnings = False

# Format output in YAML instead of JSON-like structure
# Easier to read for humans during debugging
result_format = yaml

# Global timeout for task execution (seconds)
# Prevents long hangs on slow/unreachable devices
timeout = 60

# Connection timeout (initial SSH/TCP connection)
# Important for lab environments with unstable routing
connect_timeout = 60


###############################################################
# Roles & Collections Paths
###############################################################

# Custom roles directory (project-local)
# Allows portable role development without global installs
roles_path = ./roles

# Custom collections directory
# Useful for offline installs or version-controlled collections
collections_paths = ./collections


###############################################################
# Python Interpreter Handling
###############################################################

# Automatically select Python interpreter on target
# "auto_silent" avoids warnings when interpreter path changes
# Safe default for mixed environments (Linux hosts, etc.)
interpreter_python = auto_silent


###############################################################
# Privilege Escalation (become)
###############################################################

[privilege_escalation]

# Disable global privilege escalation by default
# Network devices use "enable" via playbook/inventory instead
become = False


###############################################################
# SSH Connection Settings
###############################################################

[ssh_connection]

# Enables SSH pipelining (reduces round trips)
# Improves performance significantly, especially at scale
# Requires 'requiretty' disabled on Linux targets (not relevant for IOS)
pipelining = True

# SSH arguments applied to ALL connections
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

# StrictHostKeyChecking=no:
#   Automatically accepts new host keys (no prompt)
#   Useful for ephemeral lab environments

# UserKnownHostsFile=/dev/null:
#   Prevents storing host keys locally
#   Avoids "host key changed" issues in frequently rebuilt labs

# NOTE:
# Legacy crypto options (KexAlgorithms, ssh-rsa, etc.)
# are intentionally NOT included here.
# Those are scoped per-host in inventory for older devices only.