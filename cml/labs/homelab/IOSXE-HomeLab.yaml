        content: |-
          #cloud-config
          hostname: automation-host
          manage_etc_hosts: true
          system_info:
            default_user:
              name: cisco
          password: $6$gGxZNKhpRMVkT9xx$/k1iAaUcqDvy3idlzn0ORfhKOjXPgHUJrxs1BhzqzVNfSbkpKEIiksqVp3dvZWFTFAZN4katCH5GCfJ.azCSe0
          chpasswd:
            expire: false
          ssh_pwauth: true

          bootcmd:
            - |
                systemctl stop \
                  apt-news.service \
                  esm-cache.service \
                  update-notifier-download.service \
                  update-notifier-download.timer \
                  packagekit.service \
                  packagekit.socket \
